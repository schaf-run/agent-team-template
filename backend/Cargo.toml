[workspace]
resolver = "2"
members = [
    "crates/model-core",
    "crates/model-transcode",
    "crates/model-storage",
    "crates/model-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8.9"
async-trait = "0.1.92"
tobj = { version = "4.0.5", default-features = false }
meshopt = "0.6.2"
gltf-json = "1.4.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
ulid = "3.0.0"
rand = "0.10.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "1"
tracing-subscriber = "0.3"

model-core = { path = "crates/model-core" }
model-transcode = { path = "crates/model-transcode" }
model-storage = { path = "crates/model-storage" }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
